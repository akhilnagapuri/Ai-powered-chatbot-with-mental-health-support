<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .icon{
        width: 200px;
        float: left;
        height: 70px;
    }
    
    .logo{
        color: #ff7200;
        font-size: 35px;
        font-family: Arial;
        padding-left: 20px;
        float: left;
        padding-top: 10px;
    }
    
     .navbar{
        width: 1200px;
        height: 75px;
        margin: auto;
    }
    .menu{
        width: 400px;
        float: left;
        height: 70px;
    }
    
    ul{
        float: left;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    
    ul li{
        list-style: none;
        margin-left: 62px;
        margin-top: 27px;
        font-size: 14px;
    }
    ul li a{
        text-decoration: none;
        color: #fff;
        font-family: Arial;
        font-weight: bold;
        transition: 0.4s ease-in-out;
    }
    
    ul li a:hover{
        color: #ff7200;
    }
    
    

    body{
        display: flex;
        justify-content: center;
    }
    body .main{
        width: 1350px;
        height: 80vh;
        margin-top: 60px;
    }
    body{
        background: linear-gradient(to top,rgba(0,0,0,0.5)50%,rgba(0,0,0,0.5)50%),url('https://img.freepik.com/premium-vector/concept-chatbot-chat-ai_387612-628.jpg?uid=R170040839&ga=GA1.1.443125249.1746552882&semt=ais_hybrid&w=740');
        background-repeat: no-repeat;
        width: 100%;
        background-position: center;
        background-size: cover;
        background-attachment: fixed;
        height: 100vh;
        margin: 0;
    }

    section{
        margin-top: 20px;
        background-color: #f7f4f457;
        margin: 0%;
        padding: 0%;
        margin-left: 0;
        width: 800px;
        height: 0;
    }
    section img{
        width: 1000px;
    }

    
    .dropdown {
        position: relative;
    }
    section h1{
        margin-left: 0;
        display: flex;
        justify-content: center;
        font-size:35px;
        text-align: center;
        color: #f9f9f9;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        z-index: 1;
    }
    
    .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        text-align: left;
    }
    
    .dropdown-content a:hover {
        background-color: #f1f1f1;
    }
    
    .dropdown:hover .dropdown-content {
        display: block;
    }
    .bot::before{
        content: "HELLO_HERE_COMES_JARVIS...";
        position: absolute;
        width: 0;
        height: 60px;
        overflow: hidden;
        color: #ff7200;
        border-right: 100px #ff7200;
        transition: 4s ease-in;
    }

    .bot:hover::before{
        width: 620px;
        
    filter: drop-shadow(0 0 30px #ff7200);
    }
</style>
<body>
    <div class="main">
       <div class="navbar">
        <div class="icon">
            <h2 class="logo">AKHI</h2>
        </div>
        <div class="menu">
            <ul>
                <li><a href="/">Home</a></li>
                {% if user.is_authenticated %}
                <li><a href="{% url 'chatbot' %}">chatbot</a></li>
                <li><a href="{%  url 'logout' %}">Logout</a></li>
                {% else %}
                <li><a href="{% url 'register' %}">Signup</a></li>
                <li><a href="{% url 'login' %}">login</a></li>
                {% endif %}
            </ul>
        </div>
    </div>
        
        <section>
            <h1 style="padding-top: 20px;">AI-Powered Chatbot and Sentiment  Analysis for Mental Health Support</h1>
            <div>
                {% block main %}{% endblock %}
            </div>
            <br><br><br><br>
            <h1 class="bot">HELLO_HERE_COMES_JARVIS...</h1>
        </section>
    </div>
    </body>
</html>
